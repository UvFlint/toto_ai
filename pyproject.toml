[project]
name = "toto-ai"
version = "0.1.0"
description = "AI-powered Winner 16 football betting analyzer"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic-ai>=1.0.8",
    "httpx>=0.27",
    "selenium>=4.25",
    "rich>=13.6",
    "click>=8.1",
    "python-dotenv>=1.0",
    "tzdata>=2025.3",
    "catboost>=1.2",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[project.scripts]
toto = "toto_ai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toto_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
